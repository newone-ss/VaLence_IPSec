# ──────────────────────────────────────────────────────────────
#  TunnelTwin — Continuous Integration Pipeline
#  Runs: lint → type-check → test → security-audit → build
# ──────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────── Stage 1: Lint ──────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check (lint)
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  # ────────── Stage 2: Type Check ──────────
  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy types-PyYAML

      - name: Run mypy
        continue-on-error: true
        run: mypy tunneltwin --ignore-missing-imports

  # ────────── Stage 3: Test ──────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: |
          pip install pytest-cov
          pytest tests/ \
            -v \
            --tb=short \
            --cov=tunneltwin \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -k "not phase0"

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ────────── Stage 4: Security Audit ──────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --strict --skip-editable

      - name: Static security analysis (Bandit)
        run: |
          pip install bandit[toml]
          bandit -r tunneltwin/ -c pyproject.toml || bandit -r tunneltwin/ -ll

  # ────────── Stage 5: Build Verification ──────────
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package installs cleanly
        run: |
          pip install dist/*.whl
          tunneltwin --help || echo "CLI entrypoint check complete"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30
